	/* SPLASH SCREEN */

#splash{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;

@keyframes pulse{
0%{opacity:.4}

/* HINT TEXT */

.hint{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);

        :root {
            --cube-size: 150px;
            --anim-speed: 2s;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #070312; /* Deep midnight so the rainbow glows */
            font-family: sans-serif;
            cursor: grab; /* Cursor */
            user-select: none;
        }

        /* ══════════════ MAJESTIC RAINBOW BACKGROUND ══════════════
           A canvas of flowing aurora ribbons in full spectrum —
           slow, ethereal, majestic. The bouncing cube floats above it.
        */
        #rainbow-bg {
            position: fixed;
            inset: 0;
            z-index: -1;           /* behind EVERYTHING (cube, text, sparks) */
            background: radial-gradient(ellipse at 50% 120%, #140a30 0%, #070312 55%);
            overflow: hidden;
        }
        .ribbon {
            position: absolute;
            left: -25%;
            width: 150%;
            height: 42vh;
            border-radius: 50%;
            opacity: 0.4;
            mix-blend-mode: screen;
            filter: blur(90px);
            will-change: transform;
            animation-name: ribbonDrift, hueShift;
            animation-duration: 20s, 14s;
            animation-timing-function: ease-in-out, linear;
            animation-iteration-count: infinite, infinite;
            animation-direction: alternate, normal;
        }
        @keyframes ribbonDrift {
            0%   { transform: translateX(-14%) translateY(-4%) rotate(-5deg) scaleX(1); }
            100% { transform: translateX(14%)  translateY(6%)  rotate(5deg)  scaleX(1.12); }
        }
        /* slow full-spectrum cycle — the whole aurora shifts colour over time */
        @keyframes hueShift {
            from { filter: blur(90px) hue-rotate(0deg); }
            to   { filter: blur(90px) hue-rotate(360deg); }
        }
        /* gentle breathing glow so it feels alive */
        #rainbow-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 45%, rgba(255,255,255,0.06), transparent 60%);
            animation: bgBreathe 9s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes bgBreathe {
            0%, 100% { opacity: 0.35; }
            50%      { opacity: 0.9; }
        }

        /* ══════════════ BANSHEE PORTRAIT (bottom right) ══════════════ */
        #banshee-corner {
            position: fixed;
            right: 24px;
            bottom: 0;
            width: 340px;
            z-index: 50;
            pointer-events: none;
            /* The element already has position:fixed + z-index, which creates
               its own stacking context — so the ::before halo (z-index:-1)
               paints BEHIND the image, and the image stays unfiltered
               (real colors, no hue shift). */
        }
        /* Colour-shifting glow halo — sits behind the image, cycles spectrum */
        #banshee-corner::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            border-radius: 20px;
            background: rgba(180, 130, 255, 0.45);
            filter: blur(30px);
            animation: bansheeGlowShift 10s linear infinite;
        }
        @keyframes bansheeGlowShift {
            from { filter: blur(30px) hue-rotate(0deg); }
            to   { filter: blur(30px) hue-rotate(360deg); }
        }

        /* ══════════════ BANSHEE ORB (overlay on top of banshee.png) ══════════════
           Stacked directly over the portrait (higher z-index). Its own pixels
           shift through the spectrum, and a color-cycling halo glows behind it.
        */
        #banshee-orb {
            position: fixed;
            right: 24px;
            bottom: 0;
            width: 340px;
            z-index: 51;   /* above #banshee-corner (z-index:50) so it overlays */
            pointer-events: none;
            /* The image ITSELF cycles through the spectrum */
            animation: orbHueShift 10s linear infinite;
        }
        @keyframes orbHueShift {
            from { filter: hue-rotate(0deg); }
            to   { filter: hue-rotate(360deg); }
        }
        /* Colour-shifting glow halo behind the orb */
        #banshee-orb::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            border-radius: 20px;
            background: rgba(180, 130, 255, 0.5);
            filter: blur(28px);
            animation: orbGlowShift 10s linear infinite;
        }
        @keyframes orbGlowShift {
            from { filter: blur(28px) hue-rotate(0deg); }
            to   { filter: blur(28px) hue-rotate(360deg); }
        }
        /* ══════════════ RAINBOW WELCOME TEXT ══════════════
           Text painted with a wide flowing rainbow gradient that
           slides across the letters continuously.
        */
        .rainbow-text {
            color: transparent;
            background: linear-gradient(90deg,
                #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff00ff, #ff0000);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: rainbowFlow 5s linear infinite;
        }
        @keyframes rainbowFlow {
            from { background-position: 0% 50%; }
            to   { background-position: 300% 50%; }
        }
        @media (max-width: 640px) {
            #banshee-corner { width: 120px; right: 12px; bottom: 12px; }
            #banshee-orb { width: 120px; right: 12px; bottom: 12px; }
        }

        body:active {
            cursor: grabbing;
        }

        /* UI Hint */
        .hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            text-align: center;
            z-index: 0;
        }

        /* ══════════════ RAINBOW RAIN ══════════════
           Rainbow streaks fall from the top of the screen. When a drop
           reaches the ground it bursts into a little heart splash.
        */
        #rain-layer {
            position: fixed;
            inset: 0;
            z-index: 5;            /* above background & text, below banshee */
            pointer-events: none;
            overflow: hidden;
        }
        .drop {
            position: absolute;
            top: -60px;
            width: 4px;
            border-radius: 4px;
            will-change: transform;
            pointer-events: none;
        }
        /* Heart splash that pops where a drop lands */
        .heart-splash {
            position: absolute;
            pointer-events: none;
            line-height: 1;
            will-change: transform, opacity;
        }

        @media (max-width: 640px) {
            #banshee-corner { width: 120px; right: 12px; bottom: 12px; }
            #banshee-orb { width: 120px; right: 12px; bottom: 12px; }
        }

	(function buildRainbow() {
	    const bg = document.getElementById("rainbow-bg");
	    if (!bg) return;
	    const stops = 10; // number of ribbons
	    for (let i = 0; i < stops; i++) {
	        const ribbon = document.createElement("div");
	        ribbon.className = "ribbon";
	        const hue = (i / stops) * 360;
	        ribbon.style.background = "linear-gradient(90deg, transparent 5%, hsl(" + hue + ", 100%, 60%) 45%, hsl(" + ((hue + 40) % 360) + ", 100%, 65%) 55%, transparent 95%)";
	        // Stack ribbons from bottom (red) to top (violet) with slight overlap
	        ribbon.style.bottom = (i * 9 + 2) + "vh";
	        // Each ribbon drifts at its own majestic pace
	        ribbon.style.animationDuration = (16 + (i % 5) * 4) + "s, " + (12 + (i % 6) * 3) + "s";
	        // Negative delays so nothing syncs up — organic colour swirl
	        ribbon.style.animationDelay = (-i * 1.7) + "s, " + (-(i * 2.3) % 10) + "s";
	        bg.appendChild(ribbon);
	    }
	})();

	/* UNLOCK SCREEN + MUSIC */
	
document.addEventListener("DOMContentLoaded", () => {
    const splash = document.getElementById("splash");
    const music = document.getElementById("bgMusic");

    const songs = [
        "music1.mp3"
    ];

    // --- Step 1: Prevent clicks immediately ---
    let canClick = false;

    // Enable clicking after 2 seconds
    setTimeout(() => {
        canClick = true;
    }, 1000);

    // --- Step 2: Handle splash click ---
    splash.addEventListener("click", () => {
        if (!canClick) return; // Ignore clicks during the lock

        // Pick a random song
        const randomIndex = Math.floor(Math.random() * songs.length);
        music.src = songs[randomIndex];
        music.loop = true;
        music.load(); // Ensure audio is ready

        // Play the audio
        music.play().catch(err => console.error("Failed to play music:", err));

        // Fade out splash
        splash.style.transition = "opacity 0.5s";
        splash.style.opacity = "0";

        // Remove splash from DOM after fade
        setTimeout(() => {
            splash.style.display = "none";
        }, 500);
    });
});
	
        // --- RAINBOW RAIN ---
        // Drops fall from the top in random rainbow colors; when one reaches
        // the ground it bursts into a random heart splash.
        const rainLayer = document.getElementById('rain-layer');
        const HEARTS = ["❤️","🧡","💛","💚","💙","💜","🩷","🤍"];
        const DROPS = 45; // number of drops falling at once

        function randomRainbow() {
            return `hsl(${Math.floor(Math.random() * 360)}, 100%, 65%)`;
        }

        // Spawn one rain drop at a random x with its own speed/length/hue.
        function spawnDrop() {
            const drop = document.createElement('div');
            drop.className = 'drop';
            const x = Math.random() * window.innerWidth;
            const len = 20 + Math.random() * 35;        // streak length
            const speed = 9 + Math.random() * 10;        // px per frame
            const color = randomRainbow();
            drop.style.left = x + 'px';
            drop.style.height = len + 'px';
            drop.style.background =
                `linear-gradient(to bottom, transparent, ${color})`;
            drop.style.boxShadow = `0 0 8px ${color}`;
            // store motion data on the element
            drop._y = -60;
            drop._speed = speed;
            drop._color = color;
            rainLayer.appendChild(drop);
            return drop;
        }

        // When a drop hits the ground: pop a heart splash, then recycle it.
        function splash(drop) {
            const groundY = window.innerHeight;
            const heart = document.createElement('div');
            heart.className = 'heart-splash';
            heart.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
            const size = 16 + Math.random() * 22;
            heart.style.left = (parseFloat(drop.style.left) - size/2) + 'px';
            heart.style.top = (groundY - size) + 'px';
            heart.style.fontSize = size + 'px';
            rainLayer.appendChild(heart);

            // Splash: pop up + out, then fade
            const dx = (Math.random() - 0.5) * 90;
            const anim = heart.animate([
                { transform: 'translate(0,0) scale(0.2)', opacity: 0 },
                { transform: `translate(${dx * 0.3}px, -34px) scale(1.1)`, opacity: 1, offset: 0.35 },
                { transform: `translate(${dx}px, -6px) scale(0.8)`, opacity: 0 }
            ], {
                duration: 700 + Math.random() * 400,
                easing: 'cubic-bezier(0.2, 0.8, 0.4, 1)'
            });
            anim.onfinish = () => heart.remove();

            // Recycle the drop back to the top
            drop._y = -60;
            drop.style.left = (Math.random() * window.innerWidth) + 'px';
            drop._speed = 9 + Math.random() * 10;
            const newColor = randomRainbow();
            drop._color = newColor;
            drop.style.background = `linear-gradient(to bottom, transparent, ${newColor})`;
            drop.style.boxShadow = `0 0 8px ${newColor}`;
        }

        // Init the drops
        const drops = [];
        for (let i = 0; i < DROPS; i++) {
            const d = spawnDrop();
            d._y = Math.random() * window.innerHeight; // stagger heights
            drops.push(d);
        }

        // Animation loop
        function rainLoop() {
            for (let i = 0; i < drops.length; i++) {
                const d = drops[i];
                d._y += d._speed;
                if (d._y >= window.innerHeight) {
                    splash(d);
                } else {
                    d.style.transform = `translateY(${d._y}px)`;
                }
            }
            requestAnimationFrame(rainLoop);
        }
        rainLoop();
